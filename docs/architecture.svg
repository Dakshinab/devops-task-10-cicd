<svg width="100%" viewBox="0 0 900 620" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>DevOps CI/CD Architecture</title>
<desc>Full CI/CD pipeline from code push to deployment with monitoring and notifications</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Background sections -->
<rect x="20" y="10" width="860" height="600" rx="16" fill="#f8f9fa" stroke="#dee2e6" stroke-width="0.5"/>

<!-- Title -->
<text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#1a1a2e">DevOps CI/CD Pipeline Architecture</text>

<!-- ── ROW 1: Developer → GitHub ── -->

<!-- Developer -->
<rect x="40" y="70" width="110" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<image href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/visualstudiocode.svg" x="68" y="78" width="24" height="24" opacity="0.7"/>
<text x="95" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#0C447C">Developer</text>
<text x="95" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#185FA5">git push</text>

<!-- Arrow Dev → GitHub -->
<line x1="150" y1="102" x2="205" y2="102" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="177" y="97" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888780">push</text>

<!-- GitHub -->
<rect x="205" y="70" width="120" height="64" rx="10" fill="#2C2C2A" stroke="#444441" stroke-width="0.5"/>
<text x="265" y="100" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">⬡</text>
<text x="265" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="white">GitHub</text>
<text x="265" y="132" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#B4B2A9">Repository</text>

<!-- Arrow GitHub → GitHub Actions -->
<line x1="325" y1="102" x2="385" y2="102" stroke="#444441" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="355" y="97" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888780">triggers</text>

<!-- GitHub Actions -->
<rect x="385" y="70" width="140" height="64" rx="10" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.5"/>
<text x="455" y="96" text-anchor="middle" font-family="sans-serif" font-size="20" fill="white">⚙</text>
<text x="455" y="116" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="white">GitHub Actions</text>
<text x="455" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#9FE1CB">CI/CD Pipeline</text>

<!-- Arrow GH Actions → Docker Hub -->
<line x1="525" y1="102" x2="585" y2="102" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="555" y="97" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888780">push image</text>

<!-- Docker Hub -->
<rect x="585" y="70" width="120" height="64" rx="10" fill="#1D63ED" stroke="#1552C4" stroke-width="0.5"/>
<text x="645" y="100" text-anchor="middle" font-family="sans-serif" font-size="22" fill="white">🐳</text>
<text x="645" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="white">Docker Hub</text>
<text x="645" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A8C4F8">Image Registry</text>

<!-- Arrow DockerHub → EC2 (down then right) -->
<path d="M645 134 L645 175 L720 175 L720 215" fill="none" stroke="#1552C4" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="685" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888780">pull image</text>

<!-- Arrow GH Actions → EC2 (SSH deploy) -->
<path d="M455 134 L455 175 L720 175" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
<text x="580" y="168" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888780">SSH deploy</text>

<!-- ── ROW 2: EC2 Server ── -->

<!-- EC2 Container -->
<rect x="560" y="215" width="320" height="200" rx="14" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="720" y="238" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#633806">AWS EC2 Instance (Mumbai)</text>

<!-- Nginx inside EC2 -->
<rect x="580" y="248" width="120" height="56" rx="8" fill="#639922" stroke="#3B6D11" stroke-width="0.5"/>
<text x="640" y="272" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="white">Nginx</text>
<text x="640" y="287" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#C0DD97">Reverse Proxy</text>
<text x="640" y="300" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#C0DD97">Port 80 / 443</text>

<!-- Arrow Nginx → App -->
<line x1="700" y1="276" x2="740" y2="276" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Docker App inside EC2 -->
<rect x="740" y="248" width="120" height="56" rx="8" fill="#1D63ED" stroke="#1552C4" stroke-width="0.5"/>
<text x="800" y="269" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="white">Docker App</text>
<text x="800" y="284" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A8C4F8">Node.js</text>
<text x="800" y="297" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#A8C4F8">Port 3000</text>

<!-- SSL label -->
<rect x="580" y="320" width="280" height="28" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="720" y="339" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#27500A">🔒 SSL/TLS — HTTPS Enabled</text>

<!-- Arrow User → Nginx -->
<rect x="40" y="245" width="110" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="95" y="268" text-anchor="middle" font-family="sans-serif" font-size="20">🌐</text>
<text x="95" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#085041">User</text>
<text x="95" y="298" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0F6E56">Browser</text>

<path d="M150 273 L560 273" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="355" y="266" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888780">https://</text>

<!-- ── ROW 3: Uptime Kuma → Notifications ── -->

<!-- Uptime Kuma -->
<rect x="200" y="430" width="140" height="64" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="270" y="456" text-anchor="middle" font-family="sans-serif" font-size="18">📊</text>
<text x="270" y="474" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#791F1F">Uptime Kuma</text>
<text x="270" y="487" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A32D2D">Monitoring</text>

<!-- Arrow EC2 → Uptime Kuma (monitors) -->
<path d="M640 415 L640 447 L340 447 L340 462" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="490" y="442" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888780">checks every 60s</text>

<!-- Telegram -->
<rect x="400" y="430" width="110" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="455" y="456" text-anchor="middle" font-family="sans-serif" font-size="18">✈</text>
<text x="455" y="474" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#0C447C">Telegram</text>
<text x="455" y="487" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#185FA5">Alert</text>

<!-- Email -->
<rect x="530" y="430" width="110" height="64" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="585" y="456" text-anchor="middle" font-family="sans-serif" font-size="18">✉</text>
<text x="585" y="474" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#27500A">Email</text>
<text x="585" y="487" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3B6D11">Alert</text>

<!-- Arrows Kuma → Notifications -->
<line x1="340" y1="462" x2="400" y2="462" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="462" x2="530" y2="462" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Legend -->
<rect x="40" y="530" width="500" height="60" rx="8" fill="white" stroke="#dee2e6" stroke-width="0.5"/>
<text x="60" y="550" font-family="sans-serif" font-size="10" font-weight="600" fill="#3d3d3a">Legend:</text>
<line x1="110" y1="547" x2="140" y2="547" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="145" y="551" font-family="sans-serif" font-size="10" fill="#3d3d3a">CI/CD flow</text>
<line x1="230" y1="547" x2="260" y2="547" stroke="#1552C4" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="265" y="551" font-family="sans-serif" font-size="10" fill="#3d3d3a">SSH / Pull</text>
<line x1="350" y1="547" x2="380" y2="547" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="385" y="551" font-family="sans-serif" font-size="10" fill="#3d3d3a">Monitoring</text>

<text x="60" y="573" font-family="sans-serif" font-size="10" fill="#3d3d3a">Stack: Node.js · Docker · Nginx · GitHub Actions · AWS EC2 · Uptime Kuma</text>
</svg>
